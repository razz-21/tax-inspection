<hlm-sidebar-wrapper>
  <hlm-sidebar collapsible="icon">
    <!-- Brand -->
    <div hlmSidebarHeader class="border-sidebar-border border-b h-16 flex items-center justify-center">
      <div class="flex items-center gap-2">
        <img
          src="/icons/icon-192.png"
          alt="Tax Inspection System logo"
          class="size-8 rounded-md"
        />
        <div class="flex flex-col leading-tight group-data-[collapsible=icon]:hidden">
          <span class="text-sm font-semibold">Tax Inspection System</span>
        </div>
      </div>
    </div>

    <!-- Navigation -->
    <div hlmSidebarContent>
      <div hlmSidebarGroup>
        <div hlmSidebarGroupLabel>Platform</div>
        <div hlmSidebarGroupContent>
          <ul hlmSidebarMenu>
            @for (item of navItems; track item.link) {
              <li hlmSidebarMenuItem>
                <a
                  hlmSidebarMenuButton
                  [routerLink]="item.link"
                  routerLinkActive
                  #rla="routerLinkActive"
                  [isActive]="rla.isActive"
                >
                  <ng-icon [name]="item.icon" />
                  <span>{{ item.label }}</span>
                </a>
              </li>
            }
          </ul>
        </div>
      </div>
    </div>

    <button hlmSidebarRail></button>
  </hlm-sidebar>

  <!-- Main content -->
  <main hlmSidebarInset class="bg-muted/20">
    <app-topbar />

    <div class="p-4 lg:p-6 max-w-[1400px] mx-auto w-full">
      <router-outlet />
    </div>
  </main>
</hlm-sidebar-wrapper>
