<div class="mx-auto flex h-dvh w-full max-w-md flex-col border-x bg-background">
  <!-- Content -->
  <main
    class="fo-route-viewport relative flex-1 overflow-hidden"
    [@routeAnimations]="prepareRoute(outlet)"
    [@.disabled]="reduceMotion"
  >
    <router-outlet #outlet="outlet" />
  </main>

  <!-- Bottom navigation -->
  <nav class="grid grid-cols-3 border-t bg-background">
    @for (tab of tabs; track tab.link) {
      <a
        [routerLink]="tab.link"
        routerLinkActive="text-primary"
        [routerLinkActiveOptions]="{ exact: true }"
        #rla="routerLinkActive"
        class="flex flex-col items-center gap-1 py-2.5 text-xs font-medium text-muted-foreground transition-colors"
      >
        <span class="relative">
          <ng-icon [name]="tab.icon" size="1.375rem" />
          @if (tab.link === 'deliveries/drafts' && draftCount() > 0) {
            <span
              class="absolute -right-2 -top-1.5 flex min-w-4 items-center justify-center rounded-full bg-primary px-1 text-[0.625rem] font-semibold leading-4 text-primary-foreground"
            >
              {{ draftCount() }}
            </span>
          }
        </span>
        <span>{{ tab.label }}</span>
      </a>
    }
  </nav>
</div>
